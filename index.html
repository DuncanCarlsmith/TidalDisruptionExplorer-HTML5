<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tidal Disruption Explorer</title>
  <!-- Favicon: yellow source + 3-particle blue cluster, scalable SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23121620%27/%3E%3Ccircle cx=%2710%27 cy=%2716%27 r=%274%27 fill=%27%23eebb33%27/%3E%3Ccircle cx=%2722%27 cy=%2712%27 r=%272%27 fill=%27%2376b6e0%27/%3E%3Ccircle cx=%2725%27 cy=%2716%27 r=%272%27 fill=%27%2376b6e0%27/%3E%3Ccircle cx=%2722%27 cy=%2720%27 r=%272%27 fill=%27%2376b6e0%27/%3E%3C/svg%3E">
  <!-- MathJax 3 (lazy-loaded for popup math; doesn't block GUI) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath:  [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
      },
      svg: { fontCache: 'global' },
      startup: {
        // We typeset on-demand from Modal.show — don't auto-typeset the page.
        typeset: false,
      },
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
          id="mathjax-script"></script>
  <style>
    /* =========================================================================
       Theme variables
       ========================================================================= */
    :root[data-theme="dark"] {
      --bg:        #1c1c1e;
      --panel-bg:  #2a2a2c;
      --panel-fg:  #e6e6e6;
      --panel-border: #444;
      --label-fg:  #c8c8c8;
      --label-disabled: #666;
      --input-bg:  #1c1c1e;
      --input-fg:  #ffffff;
      --input-border: #555;
      --input-disabled-bg: #232325;
      --input-disabled-fg: #666;
      --btn-bg:    #3a3a3c;
      --btn-fg:    #ffffff;
      --btn-hover: #4a4a4c;
      --btn-active: #5a5a5c;
      --canvas-bg: #1c1c1e;
      --grid:      #2e2e30;
      --axis:      #3a3a3c;
      --diag-bg:   #2a2a2c;
      --diag-fg:   #e6e6e6;
      --src-fill:   #ffd966;
      --src-edge:   #cc9933;
      --roche-3d:   rgba(242, 76, 76, 1.0);
      --roche-disk: rgba(255, 166, 51, 1.0);
      --particle-fill: #99d8ff;
    }
    :root[data-theme="light"] {
      --bg:        #f5f5f5;
      --panel-bg:  #ffffff;
      --panel-fg:  #1a1a1a;
      --panel-border: #ccc;
      --label-fg:  #333;
      --label-disabled: #aaa;
      --input-bg:  #ffffff;
      --input-fg:  #1a1a1a;
      --input-border: #bbb;
      --input-disabled-bg: #efefef;
      --input-disabled-fg: #999;
      --btn-bg:    #e8e8ea;
      --btn-fg:    #1a1a1a;
      --btn-hover: #d8d8da;
      --btn-active: #c8c8ca;
      --canvas-bg: #ffffff;
      --grid:      #ececec;
      --axis:      #d0d0d0;
      --diag-bg:   #ffffff;
      --diag-fg:   #1a1a1a;
      --src-fill:   #f4b400;
      --src-edge:   #b07d00;
      --roche-3d:   rgba(204, 0, 0, 1.0);
      --roche-disk: rgba(220, 120, 0, 1.0);
      --particle-fill: #1f78b4;
    }

    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--panel-fg);
      overflow: hidden;
    }

    /* =========================================================================
       Layout
       ========================================================================= */
    #app {
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: 1fr 80px;
      gap: 0;
      height: 100vh;
      width: 100vw;
    }
    #controls-panel {
      grid-row: 1 / 2;
      grid-column: 1 / 2;
      background: var(--panel-bg);
      color: var(--panel-fg);
      border-right: 1px solid var(--panel-border);
      overflow-y: auto;
      padding: 8px;
      box-sizing: border-box;
    }
    #controls-panel h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--panel-fg);
    }
    #canvas-pane {
      grid-row: 1 / 2;
      grid-column: 2 / 3;
      background: var(--canvas-bg);
      position: relative;
      overflow: hidden;
    }
    #canvas-pane canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #diag-strip {
      grid-row: 2 / 3;
      grid-column: 1 / 3;
      background: var(--diag-bg);
      color: var(--diag-fg);
      border-top: 1px solid var(--panel-border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      padding: 0 16px;
      font-size: 14px;
      font-family: ui-monospace, Menlo, monospace;
    }

    /* =========================================================================
       Controls grid
       ========================================================================= */
    .ctl-grid {
      display: grid;
      grid-template-columns: 110px 60px 110px 60px;
      column-gap: 4px;
      row-gap: 3px;
      align-items: center;
    }
    .ctl-grid > .span2 { grid-column: span 2; }
    .ctl-grid > .span4 { grid-column: span 4; }

    label {
      font-size: 11px;
      color: var(--label-fg);
      padding-right: 4px;
      user-select: none;
    }
    label.disabled { color: var(--label-disabled); }

    input[type="number"], select {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      color: var(--input-fg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      height: 26px;
    }
    input[type="number"]:disabled,
    select:disabled {
      background: var(--input-disabled-bg);
      color: var(--input-disabled-fg);
    }
    button {
      box-sizing: border-box;
      width: 100%;
      height: 26px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      padding: 0 6px;
    }
    button:hover  { background: var(--btn-hover);  }
    button:active { background: var(--btn-active); }
    button:disabled {
      background: var(--input-disabled-bg);
      color: var(--input-disabled-fg);
      cursor: not-allowed;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    /* =========================================================================
       Modal popup (M6b)
       ========================================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.visible { display: flex; }
    .modal-window {
      background: var(--panel-bg);
      color: var(--panel-fg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      width: min(720px, 92vw);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .modal-close {
      width: 28px; height: 28px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--panel-fg);
    }
    .modal-close:hover { background: var(--btn-hover); }
    .modal-body {
      padding: 12px 18px 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .modal-body p {
      margin: 0 0 0.8em 0;
    }
    .modal-body p:last-child { margin-bottom: 0; }

    /* Help/About content styling (M6c) */
    .modal-body .help-section {
      margin: 1.2em 0 0.4em 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--panel-fg);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 4px;
    }
    .modal-body .help-section:first-child { margin-top: 0; }
    .modal-body .help-entry {
      margin: 0 0 0.9em 0;
    }
    .modal-body .help-entry .help-label {
      font-weight: 600;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--panel-fg);
    }
    .modal-body .help-entry .help-units {
      font-size: 11px;
      color: var(--label-fg);
      font-style: italic;
      margin-left: 0.5em;
    }
    .modal-body .help-entry .help-desc {
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--panel-fg);
      white-space: pre-wrap;
    }
    .modal-body .about-section-heading {
      font-weight: 700;
      font-size: 14px;
      margin: 1.2em 0 0.4em 0;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 4px;
    }
    .modal-body .about-section-heading:first-child { margin-top: 0; }
    .modal-body .about-paragraph {
      margin: 0 0 0.7em 0;
      white-space: pre-wrap;
    }
    .modal-body .about-formula {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12.5px;
      margin: 0.2em 0 0.7em 1.5em;
      color: var(--panel-fg);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="controls-panel">
      <h2>Controls</h2>
      <div class="ctl-grid" id="controls-grid"></div>
    </div>
    <div id="canvas-pane">
      <canvas id="sim-canvas"></canvas>
    </div>
    <div id="diag-strip">
      <div id="diag-t">t = 0</div>
      <div id="diag-sep">sep = </div>
      <div id="diag-speed">COM v = </div>
      <div id="diag-bound">bound = </div>
      <div id="diag-E">E = </div>
      <div id="diag-L">L_z = </div>
    </div>
  </div>

  <!-- Modal popup (M6b) -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="modal-title">Title</h3>
        <button class="modal-close" id="modal-close" title="Close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="tde_modules.js"></script>
  <script src="help_text.js"></script>
  <script>
  const App = (function () {
    'use strict';

    // 22 numeric parameters in MATLAB order: [labelText, cfgKey].
    const PARAM_TABLE = [
      ['dt',              'dt'],
      ['energyLoss',      'energyLoss'],
      ['vRestThreshold',  'vRestThreshold'],
      ['timerPeriod',     'timerPeriod'],
      ['Nparticles',      'Nparticles'],
      ['particleMass',    'particleMass'],
      ['particleRadius',  'particleRadius'],
      ['edgeGap',         'edgeGap'],
      ['sourceMass',      'sourceMass'],
      ['stellarRadius',   'stellarRadius'],
      ['periapsis',       'periapsis'],
      ['eccentricity',    'eccentricity'],
      ['vInfinity',       'vInfinity'],
      ['impactAngle',     'impactAngle'],
      ['M1',              'M1'],
      ['M2',              'M2'],
      ['binarySep',       'binarySep'],
      ['binaryEcc',       'binaryEcc'],
      ['binStartPhase',   'binaryStartPhase'],
      ['circumbRatio',    'circumbinaryRatio'],
      ['swirlFactor',     'swirlFactor'],
      ['sigma_v',         'sigma_v'],
    ];

    const UNIVERSAL_FIELDS = ['dt','energyLoss','vRestThreshold','timerPeriod',
                              'Nparticles','particleMass','particleRadius','edgeGap',
                              'swirlFactor','sigma_v'];

    const state = {
      cfg: TDE.Defaults.scenarioDefaults('single', 'parabolic'),
      sim: null,
      handles: {},
      runState: 'paused',
      tickCount: 0,
    };

    // ---- Sim --------------------------------------------------------------
    const Sim = {};

    Sim.build = function (cfg) {
      const G = 1;

      let sources;
      if (cfg.scenarioType === 'single') {
        sources = [{ x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, m: cfg.sourceMass }];
      } else {
        sources = TDE.ICs.binary_ic(cfg.M1, cfg.M2, cfg.binarySep,
                                     cfg.binaryEcc, cfg.binaryStartPhase);
      }

      const Mc = cfg.particleMass * cfg.Nparticles;
      const scenario = { type: cfg.scenarioType, ic: cfg.clusterIC };
      const params = {
        sourceMass: cfg.sourceMass, M1: cfg.M1, M2: cfg.M2,
        clusterMass: Mc, periapsis: cfg.periapsis,
        eccentricity: cfg.eccentricity, vInfinity: cfg.vInfinity,
        lagrangePoint: cfg.lagrangePoint, circumbinaryRatio: cfg.circumbinaryRatio,
        impactAngle: cfg.impactAngle, binarySep: cfg.binarySep,
      };
      const com = TDE.ICs.cluster_ic(scenario, params);

      const offsets = TDE.Physics.hexPackedOffsets(cfg.Nparticles,
                                                    cfg.particleRadius,
                                                    cfg.edgeGap);
      const particles = TDE.Physics.allocParticles(cfg.Nparticles);
      for (let i = 0; i < cfg.Nparticles; i++) {
        const ox = offsets[i][0], oy = offsets[i][1];
        const rr = Math.max(1, Math.hypot(ox, oy));
        const ang = Math.atan2(oy, ox);
        const swirl = Math.sqrt(Math.max(0.001, G * Mc / Math.max(10, rr + 8)))
                      * cfg.swirlFactor;
        const off = i * TDE.Physics.P_STRIDE;
        particles[off + 0] = com.x + ox;
        particles[off + 1] = com.y + oy;
        particles[off + 2] = com.vx - Math.sin(ang) * swirl + cfg.sigma_v * gaussRandom();
        particles[off + 3] = com.vy + Math.cos(ang) * swirl + cfg.sigma_v * gaussRandom();
      }

      TDE.Physics.subtractTotalCOMVelocity(sources, particles, cfg.particleMass);
      TDE.Physics.computeAccelerations(sources, particles,
                                        cfg.particleMass, cfg.stellarRadius,
                                        cfg.particleRadius);

      const roche = TDE.Roche.computeRocheRadii(cfg);
      return {
        sources: sources, particles: particles, t: 0,
        rocheR_3D: roche.R3D, rocheR_disk: roche.Rdisk,
      };
    };

    function gaussRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    // ---- UI ---------------------------------------------------------------
    function buildControls() {
      const grid = document.getElementById('controls-grid');
      grid.innerHTML = '';
      const h = state.handles;

      h.btnStart = mkButton('Start', 'span2', onStart);
      h.btnPause = mkButton('Pause', 'span2', onPauseResume);
      grid.appendChild(h.btnStart);
      grid.appendChild(h.btnPause);

      h.btnHelp  = mkButton('Help',  'span2', onHelp);
      h.btnAbout = mkButton('About', 'span2', onAbout);
      grid.appendChild(h.btnHelp);
      grid.appendChild(h.btnAbout);

      h.btnReset = mkButton('Reset', 'span2', onReset);
      h.btnResetDefaults = mkButton('Reset defaults', 'span2', onResetDefaults);
      grid.appendChild(h.btnReset);
      grid.appendChild(h.btnResetDefaults);

      h.btnTheme = mkButton('Toggle theme', 'span4', onTheme);
      grid.appendChild(h.btnTheme);

      h.lblType = mkLabel('scenario', false);
      h.ddType  = mkSelect(['single','binary'], state.cfg.scenarioType, onScenarioChange);
      h.lblIC   = mkLabel('IC family', false);
      h.ddIC    = mkSelect(TDE.Defaults.icListForType(state.cfg.scenarioType),
                            state.cfg.clusterIC, onScenarioChange);
      grid.appendChild(h.lblType);
      grid.appendChild(h.ddType);
      grid.appendChild(h.lblIC);
      grid.appendChild(h.ddIC);

      h.lblLagrange = mkLabel('Lagrange pt', false);
      h.ddLagrange  = mkSelect(['L1','L2','L3','L4','L5'], state.cfg.lagrangePoint,
                                 onLagrangeChange);
      grid.appendChild(h.lblLagrange);
      grid.appendChild(h.ddLagrange);
      grid.appendChild(spacer());
      grid.appendChild(spacer());

      h.numFields = {};
      h.numLabels = {};
      for (let k = 0; k < PARAM_TABLE.length; k++) {
        const [labelText, cfgKey] = PARAM_TABLE[k];
        const lbl = mkLabel(labelText, false);
        const inp = mkNumber(state.cfg[cfgKey], (v) => onParamChange(cfgKey, v));
        grid.appendChild(lbl);
        grid.appendChild(inp);
        h.numLabels[cfgKey] = lbl;
        h.numFields[cfgKey] = inp;
      }
      updateFieldEnables();
    }

    function mkLabel(text, disabled) {
      const el = document.createElement('label');
      el.textContent = text;
      if (disabled) el.classList.add('disabled');
      return el;
    }
    function mkButton(text, spanClass, onClick) {
      const b = document.createElement('button');
      b.textContent = text;
      if (spanClass) b.classList.add(spanClass);
      b.addEventListener('click', onClick);
      return b;
    }
    function mkSelect(items, value, onChange) {
      const sel = document.createElement('select');
      for (const v of items) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = value;
      sel.addEventListener('change', onChange);
      return sel;
    }
    function mkNumber(value, onChange) {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = 'any';
      inp.value = value;
      inp.addEventListener('change', () => onChange(parseFloat(inp.value)));
      return inp;
    }
    function spacer() { const d = document.createElement('div'); return d; }

    function updateFieldEnables() {
      const rel = TDE.Defaults.relevantFields(state.cfg.scenarioType, state.cfg.clusterIC);
      const h = state.handles;
      for (const [labelText, cfgKey] of PARAM_TABLE) {
        const enabled = UNIVERSAL_FIELDS.includes(cfgKey) || rel.includes(cfgKey);
        h.numFields[cfgKey].disabled = !enabled;
        h.numLabels[cfgKey].classList.toggle('disabled', !enabled);
      }
      const isLagrange = (state.cfg.scenarioType === 'binary')
                       && (state.cfg.clusterIC === 'lagrange');
      h.ddLagrange.disabled = !isLagrange;
      h.lblLagrange.classList.toggle('disabled', !isLagrange);
    }

    // ---- Render -----------------------------------------------------------
    const Render = {};
    Render.canvas = null; Render.ctx = null;
    Render.viewport = { scaleX: 1, scaleY: 1, cx: 0, cy: 0, w: 0, h: 0, scale: 100 };

    Render.attach = function () {
      Render.canvas = document.getElementById('sim-canvas');
      Render.ctx = Render.canvas.getContext('2d');
      Render.fitCanvas();
      window.addEventListener('resize', Render.fitCanvas);
    };

    Render.fitCanvas = function () {
      const c = Render.canvas;
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      c.width  = Math.max(1, Math.round(rect.width * dpr));
      c.height = Math.max(1, Math.round(rect.height * dpr));
      Render.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      Render.viewport.w = rect.width;
      Render.viewport.h = rect.height;
      if (state.sim) Render.computeView();
      Render.draw();
    };

    Render.computeView = function () {
      const cfg = state.cfg, sim = state.sim;
      let scale;
      if (cfg.scenarioType === 'single') {
        switch (cfg.clusterIC) {
          case 'circular':   scale = cfg.periapsis * 1.5; break;
          case 'elliptical': scale = cfg.periapsis * (1 + cfg.eccentricity)
                                     / Math.max(0.001, 1 - cfg.eccentricity); break;
          case 'parabolic':  scale = cfg.periapsis * 4; break;
          case 'hyperbolic': scale = cfg.periapsis * 5; break;
          default:           scale = cfg.periapsis * 2;
        }
        scale = Math.max(scale, cfg.stellarRadius * 4);
      } else {
        switch (cfg.clusterIC) {
          case 'circumbinary':
            scale = cfg.circumbinaryRatio * cfg.binarySep * 1.2; break;
          case 'parabolic': scale = cfg.periapsis * 1.6; break;
          default:          scale = cfg.binarySep * 1.5;
        }
      }
      scale = Math.max(scale, 100);
      if (sim && sim.rocheR_disk && sim.rocheR_disk.length) {
        const maxR = Math.max.apply(null, sim.rocheR_disk);
        if (maxR > 0) scale = Math.max(scale, maxR * 1.4);
      }
      const v = Render.viewport;
      const sxFit = (v.w * 0.94) / (2 * scale);
      const syFit = (v.h * 0.94) / (2 * scale * 0.75);
      const sFit = Math.min(sxFit, syFit);
      v.scaleX = sFit; v.scaleY = sFit;
      v.cx = v.w / 2;  v.cy = v.h / 2;
      v.scale = scale;
    };

    function w2sx(x) { return Render.viewport.cx + x * Render.viewport.scaleX; }
    function w2sy(y) { return Render.viewport.cy - y * Render.viewport.scaleY; }

    Render.draw = function () {
      if (!Render.canvas) return;
      const ctx = Render.ctx, v = Render.viewport;
      ctx.fillStyle = cssVar('--canvas-bg');
      ctx.fillRect(0, 0, v.w, v.h);
      drawGrid(ctx);
      if (state.sim) {
        drawAxes(ctx);
        drawSources(ctx);
        drawParticles(ctx);
      }
    };

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    function drawGrid(ctx) {
      const v = Render.viewport;
      ctx.strokeStyle = cssVar('--grid');
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      const stepWorld = niceStep(2 * v.scale / 8);
      const xMax = Math.ceil(v.scale / stepWorld) * stepWorld;
      for (let x = -xMax; x <= xMax; x += stepWorld) {
        ctx.moveTo(w2sx(x), 0);
        ctx.lineTo(w2sx(x), v.h);
      }
      const yMax = Math.ceil(v.scale * 0.75 / stepWorld) * stepWorld;
      for (let y = -yMax; y <= yMax; y += stepWorld) {
        ctx.moveTo(0,   w2sy(y));
        ctx.lineTo(v.w, w2sy(y));
      }
      ctx.stroke();
    }
    function niceStep(approx) {
      const exp = Math.floor(Math.log10(approx));
      const base = Math.pow(10, exp);
      const m = approx / base;
      let nice;
      if      (m < 1.5) nice = 1;
      else if (m < 3.5) nice = 2;
      else if (m < 7.5) nice = 5;
      else              nice = 10;
      return nice * base;
    }
    function drawAxes(ctx) {
      const v = Render.viewport;
      ctx.strokeStyle = cssVar('--axis');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, w2sy(0)); ctx.lineTo(v.w, w2sy(0));
      ctx.moveTo(w2sx(0), 0); ctx.lineTo(w2sx(0), v.h);
      ctx.stroke();
    }
    function drawSources(ctx) {
      const sim = state.sim, cfg = state.cfg, v = Render.viewport;
      for (let k = 0; k < sim.sources.length; k++) {
        const s = sim.sources[k];
        const sx = w2sx(s.x), sy = w2sy(s.y);
        ctx.strokeStyle = cssVar('--roche-3d');
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(sx, sy, sim.rocheR_3D[k] * v.scaleX, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.strokeStyle = cssVar('--roche-disk');
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(sx, sy, sim.rocheR_disk[k] * v.scaleX, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = cssVar('--src-fill');
      ctx.strokeStyle = cssVar('--src-edge');
      ctx.lineWidth = 1.5;
      for (const s of sim.sources) {
        const sx = w2sx(s.x), sy = w2sy(s.y);
        ctx.beginPath();
        ctx.arc(sx, sy, cfg.stellarRadius * v.scaleX, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }
    }
    function drawParticles(ctx) {
      const sim = state.sim, cfg = state.cfg, v = Render.viewport;
      const STRIDE = TDE.Physics.P_STRIDE;
      const nP = sim.particles.length / STRIDE;
      const r = Math.max(1, cfg.particleRadius * v.scaleX);
      ctx.fillStyle = cssVar('--particle-fill');
      ctx.beginPath();
      for (let k = 0; k < nP; k++) {
        const off = k * STRIDE;
        const sx = w2sx(sim.particles[off]);
        const sy = w2sy(sim.particles[off + 1]);
        ctx.moveTo(sx + r, sy);
        ctx.arc(sx, sy, r, 0, 2 * Math.PI);
      }
      ctx.fill();
    }

    function updateDiagStrip() {
      const sim = state.sim;
      const cfg = state.cfg;
      if (!sim) return;
      // Cluster COM
      const STRIDE = TDE.Physics.P_STRIDE;
      const nP = sim.particles.length / STRIDE;
      let cmx = 0, cmy = 0, cmvx = 0, cmvy = 0;
      for (let k = 0; k < nP; k++) {
        const off = k * STRIDE;
        cmx  += sim.particles[off + 0];
        cmy  += sim.particles[off + 1];
        cmvx += sim.particles[off + 2];
        cmvy += sim.particles[off + 3];
      }
      cmx /= nP; cmy /= nP; cmvx /= nP; cmvy /= nP;

      const bcS = TDE.Physics.barycenterOfSources(sim.sources);
      const sep = Math.hypot(cmx - bcS.x,   cmy - bcS.y);
      const spd = Math.hypot(cmvx - bcS.vx, cmvy - bcS.vy);

      const bound = TDE.Physics.boundFraction(sim.particles,
                                                [cmx, cmy, cmvx, cmvy],
                                                cfg.particleMass);
      const E = TDE.Physics.totalEnergy(sim.sources, sim.particles,
                                          cfg.particleMass, cfg.stellarRadius);
      const L = TDE.Physics.angularMomentum(sim.sources, sim.particles,
                                              cfg.particleMass);
      sim.lastBound = bound;
      sim.lastE = E;
      sim.lastL = L;
      document.getElementById('diag-t').textContent     = `t = ${sim.t.toFixed(1)}`;
      document.getElementById('diag-sep').textContent   = `sep = ${sep.toFixed(1)} lu`;
      document.getElementById('diag-speed').textContent = `COM v = ${spd.toFixed(2)}`;
      document.getElementById('diag-bound').textContent = `bound = ${(100*bound).toFixed(0)}%`;
      document.getElementById('diag-E').textContent     = `E = ${E.toFixed(2)}`;
      document.getElementById('diag-L').textContent     = `L_z = ${L.toFixed(1)}`;
    }

    // Lighter update: just t/sep/speed, called on the 3 frames between full updates
    function updateDiagStripFast() {
      const sim = state.sim;
      if (!sim) return;
      const STRIDE = TDE.Physics.P_STRIDE;
      const nP = sim.particles.length / STRIDE;
      let cmx = 0, cmy = 0, cmvx = 0, cmvy = 0;
      for (let k = 0; k < nP; k++) {
        const off = k * STRIDE;
        cmx  += sim.particles[off + 0];
        cmy  += sim.particles[off + 1];
        cmvx += sim.particles[off + 2];
        cmvy += sim.particles[off + 3];
      }
      cmx /= nP; cmy /= nP; cmvx /= nP; cmvy /= nP;
      const bcS = TDE.Physics.barycenterOfSources(sim.sources);
      const sep = Math.hypot(cmx - bcS.x,   cmy - bcS.y);
      const spd = Math.hypot(cmvx - bcS.vx, cmvy - bcS.vy);
      document.getElementById('diag-t').textContent     = `t = ${sim.t.toFixed(1)}`;
      document.getElementById('diag-sep').textContent   = `sep = ${sep.toFixed(1)} lu`;
      document.getElementById('diag-speed').textContent = `COM v = ${spd.toFixed(2)}`;
    }

    // ---- Button handlers --------------------------------------------------
    let rafId = null;
    let lastWallTime = 0;

    function frame(now) {
      // Throttle to cfg.timerPeriod (seconds) like MATLAB's timer Period.
      const periodMs = state.cfg.timerPeriod * 1000;
      if (now - lastWallTime >= periodMs) {
        lastWallTime = now;
        if (state.runState === 'running' && state.sim) {
          tickPhysics();
          Render.draw();
          state.tickCount++;
          if ((state.tickCount % 4) === 0) updateDiagStrip();
          else updateDiagStripFast();
        }
      }
      rafId = requestAnimationFrame(frame);
    }

    function tickPhysics() {
      const cfg = state.cfg;
      const sim = state.sim;
      TDE.Physics.verletStep(sim.sources, sim.particles,
                              cfg.particleMass, cfg.stellarRadius,
                              cfg.energyLoss, cfg.particleRadius, cfg.dt,
                              cfg.vRestThreshold);
      sim.t += cfg.dt;
    }

    function startRAF() {
      if (rafId !== null) return;
      lastWallTime = 0;
      rafId = requestAnimationFrame(frame);
    }
    function stopRAF() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function onStart() {
      state.runState = 'running';
      state.handles.btnPause.textContent = 'Pause';
      state.handles.btnResetDefaults.disabled = true;
      startRAF();
    }
    function onPauseResume() {
      if (state.runState === 'running') {
        state.runState = 'paused';
        state.handles.btnPause.textContent = 'Resume';
        state.handles.btnResetDefaults.disabled = false;
      } else {
        state.runState = 'running';
        state.handles.btnPause.textContent = 'Pause';
        state.handles.btnResetDefaults.disabled = true;
        startRAF();
      }
    }
    // ---- Help and About content builders (M6c) --------------------------
    function buildHelpContent() {
      const root = document.createElement('div');

      // Header paragraph
      const headerLines = TDE_HelpText.helpHeader.split('\n\n');
      for (const para of headerLines) {
        const p = document.createElement('p');
        p.textContent = para;
        root.appendChild(p);
      }

      // Section: Numeric parameters
      const secParams = document.createElement('div');
      secParams.className = 'help-section';
      secParams.textContent = 'NUMERIC PARAMETERS';
      root.appendChild(secParams);

      // Iterate in the same order as the GUI controls panel.
      for (const [labelText, cfgKey] of PARAM_TABLE) {
        const entry = TDE_HelpText.params[cfgKey];
        if (!entry) continue;
        root.appendChild(makeHelpEntry(entry));
      }

      // Section: Diagnostic readouts
      const secDiags = document.createElement('div');
      secDiags.className = 'help-section';
      secDiags.textContent = 'DIAGNOSTIC READOUTS';
      root.appendChild(secDiags);

      const diagOrder = ['t', 'sep', 'COM_v', 'bound', 'E', 'L_z'];
      for (const key of diagOrder) {
        const entry = TDE_HelpText.diagnostics[key];
        if (!entry) continue;
        root.appendChild(makeHelpEntry(entry));
      }

      return root;
    }

    function makeHelpEntry(entry) {
      const div = document.createElement('div');
      div.className = 'help-entry';
      const head = document.createElement('div');
      const lbl  = document.createElement('span');
      lbl.className = 'help-label';
      lbl.textContent = entry.label;
      const units = document.createElement('span');
      units.className = 'help-units';
      // Avoid double parens when units string already has parens (e.g. "s (wall clock)")
      const u = entry.units || '';
      units.textContent = (u.includes('(')) ? u : ('(' + u + ')');
      head.appendChild(lbl);
      head.appendChild(units);
      div.appendChild(head);
      const desc = document.createElement('div');
      desc.className = 'help-desc';
      desc.textContent = entry.description;
      div.appendChild(desc);
      return div;
    }

    function buildAboutContent() {
      const root = document.createElement('div');
      // The aboutText array is a sequence of paragraphs, with section
      // headings (all-caps lines) and indented formula lines (start with
      // 4 spaces). Render each accordingly.
      for (const line of TDE_HelpText.aboutText) {
        if (line === '') continue;
        if (isAboutHeading(line)) {
          const h = document.createElement('div');
          h.className = 'about-section-heading';
          h.textContent = line;
          root.appendChild(h);
        } else if (line.startsWith('    ')) {
          const f = document.createElement('div');
          f.className = 'about-formula';
          f.textContent = line.trim();
          root.appendChild(f);
        } else {
          const p = document.createElement('div');
          p.className = 'about-paragraph';
          p.textContent = line;
          root.appendChild(p);
        }
      }
      return root;
    }

    function isAboutHeading(line) {
      // A heading is short, mostly-uppercase (allowing "vs" / "to" etc.),
      // and at least 4 chars long. Rule: at least 4 letters AND at least
      // 70% of the letters are uppercase.
      if (line.length < 4 || line.length > 40) return false;
      const letters = line.replace(/[^A-Za-z]/g, '');
      if (letters.length < 4) return false;
      const upper = letters.replace(/[^A-Z]/g, '');
      return upper.length / letters.length >= 0.7;
    }

    function onHelp()        { Modal.show('Help', buildHelpContent()); }
    function onAbout()       { Modal.show('About', buildAboutContent()); }

    function onReset() {
      stopRAF();
      state.runState = 'paused';
      state.tickCount = 0;
      state.handles.btnPause.textContent = 'Resume';
      state.handles.btnResetDefaults.disabled = false;
      state.sim = Sim.build(state.cfg);
      Render.computeView();
      Render.draw();
      updateDiagStrip();
    }

    function onResetDefaults() {
      const cfgNew = TDE.Defaults.scenarioDefaults(state.cfg.scenarioType,
                                                    state.cfg.clusterIC);
      state.cfg = cfgNew;
      for (const [_, cfgKey] of PARAM_TABLE) {
        if (cfgKey in cfgNew) state.handles.numFields[cfgKey].value = cfgNew[cfgKey];
      }
      state.handles.ddType.value = cfgNew.scenarioType;
      const icItems = TDE.Defaults.icListForType(cfgNew.scenarioType);
      const sel = state.handles.ddIC;
      sel.innerHTML = '';
      for (const v of icItems) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = cfgNew.clusterIC;
      state.handles.ddLagrange.value = cfgNew.lagrangePoint;
      onReset();
    }

    function onTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = (cur === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      state.cfg.themeMode = next;
      Render.draw();
    }

    function onScenarioChange() {
      const newType = state.handles.ddType.value;
      const icItems = TDE.Defaults.icListForType(newType);
      let newIC = state.handles.ddIC.value;
      if (!icItems.includes(newIC)) newIC = icItems[0];
      const sel = state.handles.ddIC;
      sel.innerHTML = '';
      for (const v of icItems) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = newIC;
      state.cfg.scenarioType = newType;
      state.cfg.clusterIC = newIC;
      onReset();
      updateFieldEnables();
    }
    function onLagrangeChange() {
      state.cfg.lagrangePoint = state.handles.ddLagrange.value;
      onReset();
    }
    function onParamChange(name, val) {
      if (!isFinite(val)) return;
      state.cfg[name] = val;
      onReset();
    }

    // ---- Modal popup (M6b) ----------------------------------------------
    const Modal = {};
    Modal.overlay = null;
    Modal.titleEl = null;
    Modal.bodyEl  = null;
    Modal.closeEl = null;
    Modal.isOpen  = false;
    Modal._wasRunning = false;

    Modal.attach = function () {
      Modal.overlay = document.getElementById('modal-overlay');
      Modal.titleEl = document.getElementById('modal-title');
      Modal.bodyEl  = document.getElementById('modal-body');
      Modal.closeEl = document.getElementById('modal-close');

      Modal.closeEl.addEventListener('click', Modal.hide);
      // Click on overlay (outside the window) to close
      Modal.overlay.addEventListener('click', (ev) => {
        if (ev.target === Modal.overlay) Modal.hide();
      });
      // Escape key to close
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && Modal.isOpen) Modal.hide();
      });
    };

    // Show a modal with a title and content (string of text or HTML node).
    Modal.show = function (title, content) {
      Modal.titleEl.textContent = title;
      // Accept either a string (treated as plain text -> wrap in <p>) or a
      // DOM node (used as-is by M6c when richer content is needed).
      Modal.bodyEl.innerHTML = '';
      if (typeof content === 'string') {
        const p = document.createElement('p');
        p.textContent = content;
        Modal.bodyEl.appendChild(p);
      } else if (content instanceof Node) {
        Modal.bodyEl.appendChild(content);
      }
      // Pause the simulation while modal is open (don't lose physics during reading)
      Modal._wasRunning = (state.runState === 'running');
      if (Modal._wasRunning) {
        state.runState = 'paused';
        state.handles.btnPause.textContent = 'Resume';
        state.handles.btnResetDefaults.disabled = false;
      }
      Modal.overlay.classList.add('visible');
      Modal.overlay.setAttribute('aria-hidden', 'false');
      Modal.isOpen = true;
      // Typeset math, if MathJax is available. If still loading, wait for it.
      Modal.typesetMath();
    };

    // Run MathJax on the modal body, defensively (handles all loading states).
    Modal.typesetMath = function () {
      if (typeof window.MathJax === 'undefined') return;
      const tj = () => {
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([Modal.bodyEl]).catch((err) => {
            console.warn('MathJax typeset failed:', err && err.message);
          });
        }
      };
      // If MathJax has already initialized, typeset directly; else wait on its
      // startup promise.
      if (window.MathJax.startup && window.MathJax.startup.promise) {
        window.MathJax.startup.promise.then(tj);
      } else {
        tj();
      }
    };

    Modal.hide = function () {
      Modal.overlay.classList.remove('visible');
      Modal.overlay.setAttribute('aria-hidden', 'true');
      Modal.isOpen = false;
      // Resume if we paused on open
      if (Modal._wasRunning) {
        state.runState = 'running';
        state.handles.btnPause.textContent = 'Pause';
        state.handles.btnResetDefaults.disabled = true;
        startRAF();
        Modal._wasRunning = false;
      }
    };

    function init() {
      document.documentElement.setAttribute('data-theme', state.cfg.themeMode || 'dark');
      Render.attach();
      Modal.attach();
      buildControls();
      state.sim = Sim.build(state.cfg);
      Render.computeView();
      Render.draw();
      updateDiagStrip();
      window.TDE_App = {
        state:   () => state,
        cfg:     () => state.cfg,
        sim:     () => state.sim,
        onReset, onTheme, onScenarioChange,
        Modal: Modal,
        // Headless step: advance physics N times without RAF/render. For tests.
        stepN: (n) => {
          for (let i = 0; i < n; i++) tickPhysics();
          Render.draw();
          updateDiagStrip();
        },
        version: '0.1.0',
      };
    }

    return { init: init };
  })();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.init);
  } else {
    App.init();
  }
  </script>
</body>
</html>
