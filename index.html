<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tidal Disruption Explorer</title>
  <style>
    /* =========================================================================
       Theme variables
       ========================================================================= */
    :root[data-theme="dark"] {
      --bg:        #1c1c1e;
      --panel-bg:  #2a2a2c;
      --panel-fg:  #e6e6e6;
      --panel-border: #444;
      --label-fg:  #c8c8c8;
      --label-disabled: #666;
      --input-bg:  #1c1c1e;
      --input-fg:  #ffffff;
      --input-border: #555;
      --input-disabled-bg: #232325;
      --input-disabled-fg: #666;
      --btn-bg:    #3a3a3c;
      --btn-fg:    #ffffff;
      --btn-hover: #4a4a4c;
      --btn-active: #5a5a5c;
      --canvas-bg: #1c1c1e;
      --grid:      #2e2e30;
      --axis:      #3a3a3c;
      --diag-bg:   #2a2a2c;
      --diag-fg:   #e6e6e6;
      --src-fill:   #ffd966;
      --src-edge:   #cc9933;
      --roche-3d:   rgba(242, 76, 76, 1.0);
      --roche-disk: rgba(255, 166, 51, 1.0);
      --particle-fill: #99d8ff;
    }
    :root[data-theme="light"] {
      --bg:        #f5f5f5;
      --panel-bg:  #ffffff;
      --panel-fg:  #1a1a1a;
      --panel-border: #ccc;
      --label-fg:  #333;
      --label-disabled: #aaa;
      --input-bg:  #ffffff;
      --input-fg:  #1a1a1a;
      --input-border: #bbb;
      --input-disabled-bg: #efefef;
      --input-disabled-fg: #999;
      --btn-bg:    #e8e8ea;
      --btn-fg:    #1a1a1a;
      --btn-hover: #d8d8da;
      --btn-active: #c8c8ca;
      --canvas-bg: #ffffff;
      --grid:      #ececec;
      --axis:      #d0d0d0;
      --diag-bg:   #ffffff;
      --diag-fg:   #1a1a1a;
      --src-fill:   #f4b400;
      --src-edge:   #b07d00;
      --roche-3d:   rgba(204, 0, 0, 1.0);
      --roche-disk: rgba(220, 120, 0, 1.0);
      --particle-fill: #1f78b4;
    }

    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--panel-fg);
      overflow: hidden;
    }

    /* =========================================================================
       Layout
       ========================================================================= */
    #app {
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: 1fr 80px;
      gap: 0;
      height: 100vh;
      width: 100vw;
    }
    #controls-panel {
      grid-row: 1 / 2;
      grid-column: 1 / 2;
      background: var(--panel-bg);
      color: var(--panel-fg);
      border-right: 1px solid var(--panel-border);
      overflow-y: auto;
      padding: 8px;
      box-sizing: border-box;
    }
    #controls-panel h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--panel-fg);
    }
    #canvas-pane {
      grid-row: 1 / 2;
      grid-column: 2 / 3;
      background: var(--canvas-bg);
      position: relative;
      overflow: hidden;
    }
    #canvas-pane canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #diag-strip {
      grid-row: 2 / 3;
      grid-column: 1 / 3;
      background: var(--diag-bg);
      color: var(--diag-fg);
      border-top: 1px solid var(--panel-border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      padding: 0 16px;
      font-size: 14px;
      font-family: ui-monospace, Menlo, monospace;
    }

    /* =========================================================================
       Controls grid
       ========================================================================= */
    .ctl-grid {
      display: grid;
      grid-template-columns: 110px 60px 110px 60px;
      column-gap: 4px;
      row-gap: 3px;
      align-items: center;
    }
    .ctl-grid > .span2 { grid-column: span 2; }
    .ctl-grid > .span4 { grid-column: span 4; }

    label {
      font-size: 11px;
      color: var(--label-fg);
      padding-right: 4px;
      user-select: none;
    }
    label.disabled { color: var(--label-disabled); }

    input[type="number"], select {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      color: var(--input-fg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      height: 26px;
    }
    input[type="number"]:disabled,
    select:disabled {
      background: var(--input-disabled-bg);
      color: var(--input-disabled-fg);
    }
    button {
      box-sizing: border-box;
      width: 100%;
      height: 26px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      padding: 0 6px;
    }
    button:hover  { background: var(--btn-hover);  }
    button:active { background: var(--btn-active); }
    button:disabled {
      background: var(--input-disabled-bg);
      color: var(--input-disabled-fg);
      cursor: not-allowed;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div id="app">
    <div id="controls-panel">
      <h2>Controls</h2>
      <div class="ctl-grid" id="controls-grid"></div>
    </div>
    <div id="canvas-pane">
      <canvas id="sim-canvas"></canvas>
    </div>
    <div id="diag-strip">
      <div id="diag-t">t = 0</div>
      <div id="diag-sep">sep = </div>
      <div id="diag-speed">COM v = </div>
      <div id="diag-bound">bound = </div>
      <div id="diag-E">E = </div>
      <div id="diag-L">L_z = </div>
    </div>
  </div>

  <script src="tde_modules.js"></script>
  <script>
  const App = (function () {
    'use strict';

    // 22 numeric parameters in MATLAB order: [labelText, cfgKey].
    const PARAM_TABLE = [
      ['dt',              'dt'],
      ['energyLoss',      'energyLoss'],
      ['vRestThreshold',  'vRestThreshold'],
      ['timerPeriod',     'timerPeriod'],
      ['Nparticles',      'Nparticles'],
      ['particleMass',    'particleMass'],
      ['particleRadius',  'particleRadius'],
      ['edgeGap',         'edgeGap'],
      ['sourceMass',      'sourceMass'],
      ['stellarRadius',   'stellarRadius'],
      ['periapsis',       'periapsis'],
      ['eccentricity',    'eccentricity'],
      ['vInfinity',       'vInfinity'],
      ['impactAngle',     'impactAngle'],
      ['M1',              'M1'],
      ['M2',              'M2'],
      ['binarySep',       'binarySep'],
      ['binaryEcc',       'binaryEcc'],
      ['binStartPhase',   'binaryStartPhase'],
      ['circumbRatio',    'circumbinaryRatio'],
      ['swirlFactor',     'swirlFactor'],
      ['sigma_v',         'sigma_v'],
    ];

    const UNIVERSAL_FIELDS = ['dt','energyLoss','vRestThreshold','timerPeriod',
                              'Nparticles','particleMass','particleRadius','edgeGap',
                              'swirlFactor','sigma_v'];

    const state = {
      cfg: TDE.Defaults.scenarioDefaults('single', 'parabolic'),
      sim: null,
      handles: {},
      runState: 'paused',
      tickCount: 0,
    };

    // ---- Sim --------------------------------------------------------------
    const Sim = {};

    Sim.build = function (cfg) {
      const G = 1;

      let sources;
      if (cfg.scenarioType === 'single') {
        sources = [{ x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, m: cfg.sourceMass }];
      } else {
        sources = TDE.ICs.binary_ic(cfg.M1, cfg.M2, cfg.binarySep,
                                     cfg.binaryEcc, cfg.binaryStartPhase);
      }

      const Mc = cfg.particleMass * cfg.Nparticles;
      const scenario = { type: cfg.scenarioType, ic: cfg.clusterIC };
      const params = {
        sourceMass: cfg.sourceMass, M1: cfg.M1, M2: cfg.M2,
        clusterMass: Mc, periapsis: cfg.periapsis,
        eccentricity: cfg.eccentricity, vInfinity: cfg.vInfinity,
        lagrangePoint: cfg.lagrangePoint, circumbinaryRatio: cfg.circumbinaryRatio,
        impactAngle: cfg.impactAngle, binarySep: cfg.binarySep,
      };
      const com = TDE.ICs.cluster_ic(scenario, params);

      const offsets = TDE.Physics.hexPackedOffsets(cfg.Nparticles,
                                                    cfg.particleRadius,
                                                    cfg.edgeGap);
      const particles = TDE.Physics.allocParticles(cfg.Nparticles);
      for (let i = 0; i < cfg.Nparticles; i++) {
        const ox = offsets[i][0], oy = offsets[i][1];
        const rr = Math.max(1, Math.hypot(ox, oy));
        const ang = Math.atan2(oy, ox);
        const swirl = Math.sqrt(Math.max(0.001, G * Mc / Math.max(10, rr + 8)))
                      * cfg.swirlFactor;
        const off = i * TDE.Physics.P_STRIDE;
        particles[off + 0] = com.x + ox;
        particles[off + 1] = com.y + oy;
        particles[off + 2] = com.vx - Math.sin(ang) * swirl + cfg.sigma_v * gaussRandom();
        particles[off + 3] = com.vy + Math.cos(ang) * swirl + cfg.sigma_v * gaussRandom();
      }

      TDE.Physics.subtractTotalCOMVelocity(sources, particles, cfg.particleMass);
      TDE.Physics.computeAccelerations(sources, particles,
                                        cfg.particleMass, cfg.stellarRadius,
                                        cfg.particleRadius);

      const roche = TDE.Roche.computeRocheRadii(cfg);
      return {
        sources: sources, particles: particles, t: 0,
        rocheR_3D: roche.R3D, rocheR_disk: roche.Rdisk,
      };
    };

    function gaussRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    // ---- UI ---------------------------------------------------------------
    function buildControls() {
      const grid = document.getElementById('controls-grid');
      grid.innerHTML = '';
      const h = state.handles;

      h.btnStart = mkButton('Start', 'span2', onStart);
      h.btnPause = mkButton('Pause', 'span2', onPauseResume);
      grid.appendChild(h.btnStart);
      grid.appendChild(h.btnPause);

      h.btnHelp  = mkButton('Help',  'span2', onHelp);
      h.btnAbout = mkButton('About', 'span2', onAbout);
      grid.appendChild(h.btnHelp);
      grid.appendChild(h.btnAbout);

      h.btnReset = mkButton('Reset', 'span2', onReset);
      h.btnResetDefaults = mkButton('Reset defaults', 'span2', onResetDefaults);
      grid.appendChild(h.btnReset);
      grid.appendChild(h.btnResetDefaults);

      h.btnTheme = mkButton('Toggle theme', 'span4', onTheme);
      grid.appendChild(h.btnTheme);

      h.lblType = mkLabel('scenario', false);
      h.ddType  = mkSelect(['single','binary'], state.cfg.scenarioType, onScenarioChange);
      h.lblIC   = mkLabel('IC family', false);
      h.ddIC    = mkSelect(TDE.Defaults.icListForType(state.cfg.scenarioType),
                            state.cfg.clusterIC, onScenarioChange);
      grid.appendChild(h.lblType);
      grid.appendChild(h.ddType);
      grid.appendChild(h.lblIC);
      grid.appendChild(h.ddIC);

      h.lblLagrange = mkLabel('Lagrange pt', false);
      h.ddLagrange  = mkSelect(['L1','L2','L3','L4','L5'], state.cfg.lagrangePoint,
                                 onLagrangeChange);
      grid.appendChild(h.lblLagrange);
      grid.appendChild(h.ddLagrange);
      grid.appendChild(spacer());
      grid.appendChild(spacer());

      h.numFields = {};
      h.numLabels = {};
      for (let k = 0; k < PARAM_TABLE.length; k++) {
        const [labelText, cfgKey] = PARAM_TABLE[k];
        const lbl = mkLabel(labelText, false);
        const inp = mkNumber(state.cfg[cfgKey], (v) => onParamChange(cfgKey, v));
        grid.appendChild(lbl);
        grid.appendChild(inp);
        h.numLabels[cfgKey] = lbl;
        h.numFields[cfgKey] = inp;
      }
      updateFieldEnables();
    }

    function mkLabel(text, disabled) {
      const el = document.createElement('label');
      el.textContent = text;
      if (disabled) el.classList.add('disabled');
      return el;
    }
    function mkButton(text, spanClass, onClick) {
      const b = document.createElement('button');
      b.textContent = text;
      if (spanClass) b.classList.add(spanClass);
      b.addEventListener('click', onClick);
      return b;
    }
    function mkSelect(items, value, onChange) {
      const sel = document.createElement('select');
      for (const v of items) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = value;
      sel.addEventListener('change', onChange);
      return sel;
    }
    function mkNumber(value, onChange) {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = 'any';
      inp.value = value;
      inp.addEventListener('change', () => onChange(parseFloat(inp.value)));
      return inp;
    }
    function spacer() { const d = document.createElement('div'); return d; }

    function updateFieldEnables() {
      const rel = TDE.Defaults.relevantFields(state.cfg.scenarioType, state.cfg.clusterIC);
      const h = state.handles;
      for (const [labelText, cfgKey] of PARAM_TABLE) {
        const enabled = UNIVERSAL_FIELDS.includes(cfgKey) || rel.includes(cfgKey);
        h.numFields[cfgKey].disabled = !enabled;
        h.numLabels[cfgKey].classList.toggle('disabled', !enabled);
      }
      const isLagrange = (state.cfg.scenarioType === 'binary')
                       && (state.cfg.clusterIC === 'lagrange');
      h.ddLagrange.disabled = !isLagrange;
      h.lblLagrange.classList.toggle('disabled', !isLagrange);
    }

    // ---- Render -----------------------------------------------------------
    const Render = {};
    Render.canvas = null; Render.ctx = null;
    Render.viewport = { scaleX: 1, scaleY: 1, cx: 0, cy: 0, w: 0, h: 0, scale: 100 };

    Render.attach = function () {
      Render.canvas = document.getElementById('sim-canvas');
      Render.ctx = Render.canvas.getContext('2d');
      Render.fitCanvas();
      window.addEventListener('resize', Render.fitCanvas);
    };

    Render.fitCanvas = function () {
      const c = Render.canvas;
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      c.width  = Math.max(1, Math.round(rect.width * dpr));
      c.height = Math.max(1, Math.round(rect.height * dpr));
      Render.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      Render.viewport.w = rect.width;
      Render.viewport.h = rect.height;
      if (state.sim) Render.computeView();
      Render.draw();
    };

    Render.computeView = function () {
      const cfg = state.cfg, sim = state.sim;
      let scale;
      if (cfg.scenarioType === 'single') {
        switch (cfg.clusterIC) {
          case 'circular':   scale = cfg.periapsis * 1.5; break;
          case 'elliptical': scale = cfg.periapsis * (1 + cfg.eccentricity)
                                     / Math.max(0.001, 1 - cfg.eccentricity); break;
          case 'parabolic':  scale = cfg.periapsis * 4; break;
          case 'hyperbolic': scale = cfg.periapsis * 5; break;
          default:           scale = cfg.periapsis * 2;
        }
        scale = Math.max(scale, cfg.stellarRadius * 4);
      } else {
        switch (cfg.clusterIC) {
          case 'circumbinary':
            scale = cfg.circumbinaryRatio * cfg.binarySep * 1.2; break;
          case 'parabolic': scale = cfg.periapsis * 1.6; break;
          default:          scale = cfg.binarySep * 1.5;
        }
      }
      scale = Math.max(scale, 100);
      if (sim && sim.rocheR_disk && sim.rocheR_disk.length) {
        const maxR = Math.max.apply(null, sim.rocheR_disk);
        if (maxR > 0) scale = Math.max(scale, maxR * 1.4);
      }
      const v = Render.viewport;
      const sxFit = (v.w * 0.94) / (2 * scale);
      const syFit = (v.h * 0.94) / (2 * scale * 0.75);
      const sFit = Math.min(sxFit, syFit);
      v.scaleX = sFit; v.scaleY = sFit;
      v.cx = v.w / 2;  v.cy = v.h / 2;
      v.scale = scale;
    };

    function w2sx(x) { return Render.viewport.cx + x * Render.viewport.scaleX; }
    function w2sy(y) { return Render.viewport.cy - y * Render.viewport.scaleY; }

    Render.draw = function () {
      if (!Render.canvas) return;
      const ctx = Render.ctx, v = Render.viewport;
      ctx.fillStyle = cssVar('--canvas-bg');
      ctx.fillRect(0, 0, v.w, v.h);
      drawGrid(ctx);
      if (state.sim) {
        drawAxes(ctx);
        drawSources(ctx);
        drawParticles(ctx);
      }
    };

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    function drawGrid(ctx) {
      const v = Render.viewport;
      ctx.strokeStyle = cssVar('--grid');
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      const stepWorld = niceStep(2 * v.scale / 8);
      const xMax = Math.ceil(v.scale / stepWorld) * stepWorld;
      for (let x = -xMax; x <= xMax; x += stepWorld) {
        ctx.moveTo(w2sx(x), 0);
        ctx.lineTo(w2sx(x), v.h);
      }
      const yMax = Math.ceil(v.scale * 0.75 / stepWorld) * stepWorld;
      for (let y = -yMax; y <= yMax; y += stepWorld) {
        ctx.moveTo(0,   w2sy(y));
        ctx.lineTo(v.w, w2sy(y));
      }
      ctx.stroke();
    }
    function niceStep(approx) {
      const exp = Math.floor(Math.log10(approx));
      const base = Math.pow(10, exp);
      const m = approx / base;
      let nice;
      if      (m < 1.5) nice = 1;
      else if (m < 3.5) nice = 2;
      else if (m < 7.5) nice = 5;
      else              nice = 10;
      return nice * base;
    }
    function drawAxes(ctx) {
      const v = Render.viewport;
      ctx.strokeStyle = cssVar('--axis');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, w2sy(0)); ctx.lineTo(v.w, w2sy(0));
      ctx.moveTo(w2sx(0), 0); ctx.lineTo(w2sx(0), v.h);
      ctx.stroke();
    }
    function drawSources(ctx) {
      const sim = state.sim, cfg = state.cfg, v = Render.viewport;
      for (let k = 0; k < sim.sources.length; k++) {
        const s = sim.sources[k];
        const sx = w2sx(s.x), sy = w2sy(s.y);
        ctx.strokeStyle = cssVar('--roche-3d');
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(sx, sy, sim.rocheR_3D[k] * v.scaleX, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.strokeStyle = cssVar('--roche-disk');
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(sx, sy, sim.rocheR_disk[k] * v.scaleX, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle = cssVar('--src-fill');
      ctx.strokeStyle = cssVar('--src-edge');
      ctx.lineWidth = 1.5;
      for (const s of sim.sources) {
        const sx = w2sx(s.x), sy = w2sy(s.y);
        ctx.beginPath();
        ctx.arc(sx, sy, cfg.stellarRadius * v.scaleX, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }
    }
    function drawParticles(ctx) {
      const sim = state.sim, cfg = state.cfg, v = Render.viewport;
      const STRIDE = TDE.Physics.P_STRIDE;
      const nP = sim.particles.length / STRIDE;
      const r = Math.max(1, cfg.particleRadius * v.scaleX);
      ctx.fillStyle = cssVar('--particle-fill');
      ctx.beginPath();
      for (let k = 0; k < nP; k++) {
        const off = k * STRIDE;
        const sx = w2sx(sim.particles[off]);
        const sy = w2sy(sim.particles[off + 1]);
        ctx.moveTo(sx + r, sy);
        ctx.arc(sx, sy, r, 0, 2 * Math.PI);
      }
      ctx.fill();
    }

    function updateDiagStrip() {
      const sim = state.sim;
      if (!sim) return;
      document.getElementById('diag-t').textContent = `t = ${sim.t.toFixed(1)}`;
    }

    // ---- Button handlers --------------------------------------------------
    function onStart()       { console.log('Start clicked (M4 will wire animation)'); }
    function onPauseResume() { console.log('Pause/Resume clicked (M4)'); }
    function onHelp()        { console.log('Help clicked (M6)'); }
    function onAbout()       { console.log('About clicked (M6)'); }

    function onReset() {
      state.sim = Sim.build(state.cfg);
      Render.computeView();
      Render.draw();
      updateDiagStrip();
    }

    function onResetDefaults() {
      const cfgNew = TDE.Defaults.scenarioDefaults(state.cfg.scenarioType,
                                                    state.cfg.clusterIC);
      state.cfg = cfgNew;
      for (const [_, cfgKey] of PARAM_TABLE) {
        if (cfgKey in cfgNew) state.handles.numFields[cfgKey].value = cfgNew[cfgKey];
      }
      state.handles.ddType.value = cfgNew.scenarioType;
      const icItems = TDE.Defaults.icListForType(cfgNew.scenarioType);
      const sel = state.handles.ddIC;
      sel.innerHTML = '';
      for (const v of icItems) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = cfgNew.clusterIC;
      state.handles.ddLagrange.value = cfgNew.lagrangePoint;
      onReset();
    }

    function onTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = (cur === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      state.cfg.themeMode = next;
      Render.draw();
    }

    function onScenarioChange() {
      const newType = state.handles.ddType.value;
      const icItems = TDE.Defaults.icListForType(newType);
      let newIC = state.handles.ddIC.value;
      if (!icItems.includes(newIC)) newIC = icItems[0];
      const sel = state.handles.ddIC;
      sel.innerHTML = '';
      for (const v of icItems) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      }
      sel.value = newIC;
      state.cfg.scenarioType = newType;
      state.cfg.clusterIC = newIC;
      onReset();
      updateFieldEnables();
    }
    function onLagrangeChange() {
      state.cfg.lagrangePoint = state.handles.ddLagrange.value;
      onReset();
    }
    function onParamChange(name, val) {
      if (!isFinite(val)) return;
      state.cfg[name] = val;
      onReset();
    }

    function init() {
      document.documentElement.setAttribute('data-theme', state.cfg.themeMode || 'dark');
      Render.attach();
      buildControls();
      state.sim = Sim.build(state.cfg);
      Render.computeView();
      Render.draw();
      updateDiagStrip();
      window.TDE_App = {
        state:   () => state,
        cfg:     () => state.cfg,
        sim:     () => state.sim,
        onReset, onTheme, onScenarioChange,
        version: '0.1.0',
      };
    }

    return { init: init };
  })();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.init);
  } else {
    App.init();
  }
  </script>
</body>
</html>
